name: Publish shared Exact tools
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish.yml
      - .github/actions/exact-setup/**

concurrency:
  group: publish-exact-tools
  queue: max

permissions:
  contents: read

env:
  EXACT_REF: a55c5581c7e1a62cdee1f09367ea2909c74c7292
  BUN_VERSION: 1.4.5
  BUNDLE_VERSION: '10'
  BASE_TOOLS_VERSION: '5'

jobs:
  version:
    if: github.repository == 'disposabl-dev/disposabl-exact' && !github.event.forced && !github.event.created && !github.event.deleted
    permissions:
      contents: read
      pull-requests: read
    runs-on: blacksmith-2vcpu-ubuntu-2604
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      missing: ${{ steps.release.outputs.missing }}
      reuse: ${{ steps.release.outputs.reuse }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only a merge into main can publish, including squash and rebase merges.
          pulls=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls")
          if ! jq -es --arg sha "$GITHUB_SHA" 'any(.[][]; .merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha)' <<< "$pulls" >/dev/null; then
            echo "Direct push: skipping tool publication."
            exit 0
          fi
          tag="v${BUNDLE_VERSION}-exact-${EXACT_REF}-bun-${BUN_VERSION}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          status=$(curl -sS -o "$RUNNER_TEMP/release.json" -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$tag")
          case "$status" in
            200)
              jq -e --arg prefix "exact-$EXACT_REF-" --arg suffix "-bun-$BUN_VERSION.tar.zst" '
                [.assets[] | select(.state == "uploaded" and .size > 0) | .name] as $names
                | [.draft == false, ((["cargo-android.zst","cargo-gradle.zst","cargo-ios.zst","ios-link-kit.zst","ios-host-catalog.zst","ios-baker.json","ios-source-times.json","sdk.tar.zst"][]) as $extra | ("",".sha256") as $ext | $names | index($extra+$ext) != null), (("web-Linux-X64","android-Linux-X64","ios-macOS-ARM64") as $p | ("",".sha256") as $ext
                    | $names | index($prefix+$p+$suffix+$ext) != null)] | all
              ' "$RUNNER_TEMP/release.json" >/dev/null
              echo 'missing=false' >> "$GITHUB_OUTPUT" ;;
            404)
              base="v${BASE_TOOLS_VERSION}-exact-${EXACT_REF}-bun-${BUN_VERSION}"
              base_status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$base")
              case "$base_status" in
                200) echo 'reuse=true' >> "$GITHUB_OUTPUT" ;;
                404) echo 'reuse=false' >> "$GITHUB_OUTPUT" ;;
                *) echo "::error::Base tool lookup returned $base_status"; exit 1 ;;
              esac
              echo 'missing=true' >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::GitHub release lookup returned $status"; exit 1 ;;
          esac

  build:
    needs: version
    if: needs.version.outputs.missing == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: [web, android, ios]
    runs-on: ${{ matrix.platform == 'ios' && 'blacksmith-6vcpu-macos-27' || 'blacksmith-8vcpu-ubuntu-2604' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/exact-setup
        with:
          mode: ${{ needs.version.outputs.reuse == 'true' && 'consume' || 'build' }}
          bundle-version: ${{ needs.version.outputs.reuse == 'true' && env.BASE_TOOLS_VERSION || env.BUNDLE_VERSION }}
          platform: ${{ matrix.platform }}
          exact-ref: ${{ env.EXACT_REF }}
          bun-version: ${{ env.BUN_VERSION }}
      - name: Prepare public build inputs
        env:
          PLATFORM: ${{ matrix.platform }}
          EXACT_TOOLS_ORIGIN: none
          EXACT_UPDATE_TRUST: production
          EXACT_UPDATE_GENESIS: '1'
          CARGO_PROFILE_RELEASE_LTO: 'off'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
          CARGO_PROFILE_BALANCED_LTO: 'off'
          CARGO_PROFILE_SIZE_LTO: 'off'
        run: bash .github/actions/exact-setup/scripts/publish-inputs.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bundle-${{ matrix.platform }}
          path: ${{ runner.temp }}/kit-out/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  release:
    needs: [version, build]
    runs-on: blacksmith-4vcpu-ubuntu-2604
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: bundles
          merge-multiple: true
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          cd bundles
          test -s ios-host-catalog.zst
          test -s ios-host-catalog.zst.sha256
          for checksum in *.sha256; do sha256sum -c "$checksum"; done
          python3 - <<'PY_INPUTS'
          import json
          from pathlib import Path
          files = {}
          for checksum in sorted(Path(".").glob("*.sha256")):
              file = checksum.with_suffix("")
              files[file.name] = {"size": file.stat().st_size, "sha256": checksum.read_text().split()[0]}
          Path("inputs.json").write_text(json.dumps(files, sort_keys=True) + "\n")
          PY_INPUTS
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Exact ${EXACT_REF} / Bun ${BUN_VERSION}" --notes 'App-independent Exact setup bundles.' ./*
